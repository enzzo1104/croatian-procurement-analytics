[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "croatian-procurement-analytics"
version = "0.1.0"
description = "Analysis of Croatian public procurement data"
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.0,<4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
